name: terraform-deploy

on:
  pull_request:
    branches:
      - main

jobs:
  qa-plan:
    name: QA-Plan
    runs-on: ubuntu-latest
    environment: qa
   
  
    defaults:
      run:
        working-directory: infra/envs/qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Terraform Cloud token
        id: check_token
        run: |
          if [ -z "${{ secrets.MYAPP_TFE_TOKEN }}" ]; then
            echo "TOKEN_EXISTS=false" >> $GITHUB_ENV
          else
            echo "TOKEN_EXISTS=true" >> $GITHUB_ENV
          fi

      - name: Setup Terraform
        if: env.TOKEN_EXISTS == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          cli_config_credentials_token: ${{ secrets.MYAPP_TFE_TOKEN }}

      - name: Terraform Format Check
        if: env.TOKEN_EXISTS == 'true'
        run: terraform fmt -check

      - name: Terraform Init
        if: env.TOKEN_EXISTS == 'true'
        run: terraform init

      - name: Terraform Validate
        if: env.TOKEN_EXISTS == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: env.TOKEN_EXISTS == 'true'
        run: |
          echo "Running Terraform PLAN for $ENV"
          terraform plan -no-color -out=tfplan 

      - name: Upload QA Plan
        if: env.TOKEN_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-plan
          path: infra/envs/qa/tfplan

      - name: Skip Terraform steps
        if: env.TOKEN_EXISTS == 'false'
        run: echo "Skipping Terraform - token not available"


  qa-approval-gate:
    name: qa Approval Gate
    runs-on: ubuntu-latest
    needs: [qa-plan]  # Waits for QA to pass, then requests approval
    environment: qa-approval-gate  # <-- Only this environment has the approval protection rule
    steps:
      - run: echo "Approval granted. Proceeding with Prod deployment."

  qa-apply:
    name: QA-Apply 
    runs-on: ubuntu-latest
    needs: qa-approval-gate
    environment: qa
  
    defaults:
      run:
        working-directory: infra/envs/qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download QA Plan
        uses: actions/download-artifact@v4
        with:
          name: qa-plan
          path: infra/envs/qa

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          cli_config_credentials_token: ${{ secrets.MYAPP_TFE_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


  prod-plan:
    name: PROD-Plan
    runs-on: ubuntu-latest
    needs: qa-apply
    environment: prod
  
  
    defaults:
      run:
        working-directory: infra/envs/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Terraform Cloud token
        id: check_token
        run: |
          if [ -z "${{ secrets.MYAPP_TFE_TOKEN }}" ]; then
            echo "TOKEN_EXISTS=false" >> $GITHUB_ENV
          else
            echo "TOKEN_EXISTS=true" >> $GITHUB_ENV
          fi

      - name: Setup Terraform
        if: env.TOKEN_EXISTS == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          cli_config_credentials_token: ${{ secrets.MYAPP_TFE_TOKEN }}

      - name: Terraform Format Check
        if: env.TOKEN_EXISTS == 'true'
        run: terraform fmt -check

      - name: Terraform Init
        if: env.TOKEN_EXISTS == 'true'
        run: terraform init

      - name: Terraform Validate
        if: env.TOKEN_EXISTS == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: env.TOKEN_EXISTS == 'true'
        run: |
          echo "Running Terraform PLAN for $ENV"
          terraform plan -no-color -out=tfplan  # FIX: added -out=tfplan so the plan is saved

      - name: Upload PROD Plan            
        if: env.TOKEN_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prod-plan                  
          path: infra/envs/prod/tfplan   

      - name: Skip Terraform steps
        if: env.TOKEN_EXISTS == 'false'
        run: echo "Skipping Terraform - token not available"


  prod-apply:
    name: PROD-Apply
    runs-on: ubuntu-latest
    needs: prod-plan
    environment: prod
  

    defaults:
      run:
        working-directory: infra/envs/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PROD Plan
        uses: actions/download-artifact@v4
        with:
          name: prod-plan
          path: infra/envs/prod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          cli_config_credentials_token: ${{ secrets.MYAPP_TFE_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan