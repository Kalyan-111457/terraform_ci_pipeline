name: terraform-deploy

on:
  pull_request:
    branches:
      - main

jobs:
  qa-plan:
    name: QA-Plan
    runs-on: ubuntu-latest   
    defaults:
      run:
        working-directory: infra/envs/qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Terraform Cloud token
        id: check_token
        run: |
          if [ -z "${{ secrets.MYAPP_TFE_TOKEN }}" ]; then
            echo "TOKEN_EXISTS=false" >> $GITHUB_ENV
          else
            echo "TOKEN_EXISTS=true" >> $GITHUB_ENV
          fi

      - name: Setup Terraform
        if: env.TOKEN_EXISTS == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          cli_config_credentials_token: ${{ secrets.MYAPP_TFE_TOKEN }}

      - name: Terraform Format Check
        if: env.TOKEN_EXISTS == 'true'
        run: terraform fmt -check

      - name: Terraform Init
        if: env.TOKEN_EXISTS == 'true'
        run: terraform init

      - name: Terraform Validate
        if: env.TOKEN_EXISTS == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: env.TOKEN_EXISTS == 'true'
        run: |
          echo "Running Terraform PLAN for $ENV"
          terraform plan -no-color -out=tfplan> plan.txt


      - name: Terraform Show
        shell: bash
        id: show
        run: |
           if  terraform show -no-color tfplan | grep -q "No changes."; then
           echo "changes=0" >> $GITHUB_OUTPUT
           echo "No changes detecteds"
           else
           echo "changes=1" >> $GITHUB_OUTPUT
           echo "Changes detected"
           fi

      - name: Create or Update Terraform Plan PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.show.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentIdentifier = '## Latest Terraform Plan';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.body.includes(commentIdentifier)
            );

            const planOutput = process.env.PLAN || 'No changes detected.';

            const now = new Date();
            const formattedDate = new Intl.DateTimeFormat('en-US', {
              day: 'numeric',
              month: 'long',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false,
              timeZone: 'UTC'
            }).format(now) + ' UTC';

            const output = `${commentIdentifier}\n\n**Environment:** \`dev\`\n**Plan Date:** \`${formattedDate}\`\n\n<details><summary>Show Terraform Plan</summary>\n\n\u0060\u0060\u0060terraform\n${planOutput}\n\u0060\u0060\u0060\n\n</details>\n\n*Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }


      - name: Upload QA Plan
        if: env.TOKEN_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-plan
          path: infra/envs/qa/tfplan

      - name: Skip Terraform steps
        if: env.TOKEN_EXISTS == 'false'
        run: echo "Skipping Terraform - token not available"


  qa-apply:
    name: QA-Apply 
    runs-on: ubuntu-latest
    needs: qa-plan
    environment: qa
  
    defaults:
      run:
        working-directory: infra/envs/qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download QA Plan
        uses: actions/download-artifact@v4
        with:
          name: qa-plan
          path: infra/envs/qa

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          cli_config_credentials_token: ${{ secrets.MYAPP_TFE_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


  prod-plan:
    name: PROD-Plan
    runs-on: ubuntu-latest
    needs: qa-apply
    environment: prod
  
    defaults:
      run:
        working-directory: infra/envs/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Terraform Cloud token
        id: check_token
        run: |
          if [ -z "${{ secrets.MYAPP_TFE_TOKEN }}" ]; then
            echo "TOKEN_EXISTS=false" >> $GITHUB_ENV
          else
            echo "TOKEN_EXISTS=true" >> $GITHUB_ENV
          fi

      - name: Setup Terraform
        if: env.TOKEN_EXISTS == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          cli_config_credentials_token: ${{ secrets.MYAPP_TFE_TOKEN }}

      - name: Terraform Format Check
        if: env.TOKEN_EXISTS == 'true'
        run: terraform fmt -check

      - name: Terraform Init
        if: env.TOKEN_EXISTS == 'true'
        run: terraform init

      - name: Terraform Validate
        if: env.TOKEN_EXISTS == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: env.TOKEN_EXISTS == 'true'
        run: |
          echo "Running Terraform PLAN for $ENV"
          terraform plan -no-color -out=tfplan  # FIX: added -out=tfplan so the plan is saved
      
      - name: Terraform Show
        shell: bash
        id: show
        run: |
           if  terraform show -no-color tfplan | grep -q "No changes."; then
           echo "changes=0" >> $GITHUB_OUTPUT
           echo "No changes detecteds"
           else
           echo "changes=1" >> $GITHUB_OUTPUT
           echo "Changes detected"
           fi

      - name: Create or Update Terraform Plan PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.show.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentIdentifier = '## Latest Terraform Plan';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.body.includes(commentIdentifier)
            );

            const planOutput = process.env.PLAN || 'No changes detected.';

            const now = new Date();
            const formattedDate = new Intl.DateTimeFormat('en-US', {
              day: 'numeric',
              month: 'long',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false,
              timeZone: 'UTC'
            }).format(now) + ' UTC';

            const output = `${commentIdentifier}\n\n**Environment:** \`dev\`\n**Plan Date:** \`${formattedDate}\`\n\n<details><summary>Show Terraform Plan</summary>\n\n\u0060\u0060\u0060terraform\n${planOutput}\n\u0060\u0060\u0060\n\n</details>\n\n*Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }


      - name: Upload PROD Plan            
        if: env.TOKEN_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prod-plan                  
          path: infra/envs/prod/tfplan   

      - name: Skip Terraform steps
        if: env.TOKEN_EXISTS == 'false'
        run: echo "Skipping Terraform - token not available"


  prod-apply:
    name: PROD-Apply
    runs-on: ubuntu-latest
    needs: prod-plan
    environment: prod

    defaults:
      run:
        working-directory: infra/envs/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PROD Plan
        uses: actions/download-artifact@v4
        with:
          name: prod-plan
          path: infra/envs/prod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          cli_config_credentials_token: ${{ secrets.MYAPP_TFE_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan